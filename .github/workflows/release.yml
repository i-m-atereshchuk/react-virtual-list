name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC) -- without this the
  # workflow has no id-token to exchange, and publish falls back to
  # (or conflicts with) classic token auth.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Trusted publishing requires npm >= 11.5.1; the version bundled
      # with the Node setup above isn't guaranteed to be new enough.
      - run: npm install -g npm@latest

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: publishing now goes through npm trusted
          # publishing (OIDC). changesets/action writes a classic
          # authToken .npmrc whenever NPM_TOKEN is set, which
          # preempts the OIDC exchange -- so it must stay unset here.
