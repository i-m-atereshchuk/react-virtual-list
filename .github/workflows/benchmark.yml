name: Virtual List Benchmark

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  benchmark:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter playground exec playwright install chromium --with-deps

      - name: Run benchmark
        run: pnpm benchmark
